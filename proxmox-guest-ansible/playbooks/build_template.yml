---
- name: Creating a cloud-init Template for Debian 13
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/vault.yml
    - ../vars/vms.yml
    - ../vars/pve_api_defaults.yml
  module_defaults:
    ansible.builtin.uri: "{{ pve_uri_defaults }}"

  tasks:
    # --- RESET JOB ---
    - name: Check if an existing template is available
      ansible.builtin.uri:
        url: "{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ template_vmid }}/status/current"
        method: GET
        status_code: [200, 500]
      register: existing_vm

    - name: Delete the existing template if present
      ansible.builtin.uri:
        url: "{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ template_vmid }}"
        method: DELETE
      register: delete_task
      when: existing_vm.status == 200

    - name: Waiting for template deletion to complete
      ansible.builtin.uri:
        url: "{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/tasks/{{ delete_task.json.data }}/status"
        method: GET
      register: delete_status
      until: delete_status.json.data.status == "stopped"
      retries: 30
      delay: 3
      when: existing_vm.status == 200

    - name: Delete the previously downloaded image if present
      ansible.builtin.uri:
        url: "{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/storage/{{ dl_storage }}/content/{{ dl_storage }}:import/{{ image_filename }}"
        method: DELETE
        status_code: [200, 500]

    # --- BUILDING JOB ---
    - name: Download the cloud image to storage
      ansible.builtin.uri:
        url: "{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/storage/{{ dl_storage }}/download-url"
        method: POST
        body_format: json
        body:
          content: import
          filename: "{{ image_filename }}"
          url: "{{ image_url }}"
      register: dl_task

    - name: Waiting for download to complete
      ansible.builtin.uri:
        url: "{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/tasks/{{ dl_task.json.data }}/status"
        method: GET
      register: dl_status
      until: dl_status.json.data.status == "stopped"
      retries: 60
      delay: 5

    - name: Check if the download was successful
      ansible.builtin.assert:
        that: dl_status.json.data.exitstatus == "OK"
        fail_msg: "Failed to download the cloud image: {{ dl_status.json.data }}"

    - name: Create an empty VM(No disk)
      ansible.builtin.uri:
        url: "{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/qemu"
        method: POST
        body_format: json
        body:
          vmid: "{{ template_vmid }}"
          name: "{{ template_name }}"
          memory: 2048
          cores: 2
          cpu: host
          machine: q35
          scsihw: virtio-scsi-single
          net0: "virtio,bridge=vmbr0"
          net1: "virtio,bridge=vmbr1"
          serial0: socket
          vga: serial0
          ostype: l26
      register: create_task

    - name: Waiting for VM creation to complete
      ansible.builtin.uri:
        url: "{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/tasks/{{ create_task.json.data }}/status"
        method: GET
      register: create_status
      until: create_status.json.data.status == "stopped"
      retries: 30
      delay: 3

    - name: Import a Downloaded Image as a Disk
      ansible.builtin.uri:
        url: "{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ template_vmid }}/config"
        method: POST
        body_format: json
        body:
          scsi0: "{{ disk_storage }}:0,import-from={{ dl_storage }}:import/{{ image_filename }}"
      register: import_task

    - name: Waiting for disk import to complete
      ansible.builtin.uri:
        url: "{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/tasks/{{ import_task.json.data }}/status"
        method: GET
      register: import_status
      until: import_status.json.data.status == "stopped"
      retries: 60
      delay: 5
      when: import_task.json.data is defined

    - name: Configure the Cloud-init drive and boot order
      ansible.builtin.uri:
        url: "{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ template_vmid }}/config"
        method: POST
        body_format: json
        body:
          ide2: "{{ disk_storage }}:cloudinit"
          boot: "order=scsi0"
      register: cloudinit_task

    - name: Waiting for cloud-init config to apply
      ansible.builtin.uri:
        url: "{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/tasks/{{ cloudinit_task.json.data }}/status"
        method: GET
      register: cloudinit_status
      until: cloudinit_status.json.data.status == "stopped"
      retries: 30
      delay: 3
      when: cloudinit_task.json.data is defined

    - name: Templatization
      ansible.builtin.uri:
        url: "{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ template_vmid }}/template"
        method: POST
