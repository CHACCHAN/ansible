template_vmid: 9000
template_node: pve01
template_name: "debian13-cloudinit-template"

image_url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
image_filename: "debian-13-genericcloud-amd64.qcow2"
dl_storage: local
disk_storage: local-lvm

vms:
  ### Development ###
  - vmid: 201
    name: yuya-dev
    node: pve03
    ciuser: dev
    ssh_public_key: "{{ lookup('file', '~/.ssh/id_dev.pub') }}"
    ipconfig0: "ip=192.168.10.21/24,gw=192.168.10.1"
    ipconfig1: "ip=10.10.10.21/24"
    net0_bridge: vmbr0
    net1_bridge: vmbr1
    tags: "dev"

  - vmid: 202
    name: shun-dev
    node: pve04
    ciuser: dev
    ssh_public_key: "{{ lookup('file', '~/.ssh/id_dev.pub') }}"
    ipconfig0: "ip=192.168.10.22/24,gw=192.168.10.1"
    ipconfig1: "ip=10.10.10.22/24"
    net0_bridge: vmbr0
    net1_bridge: vmbr1
    tags: "dev"
