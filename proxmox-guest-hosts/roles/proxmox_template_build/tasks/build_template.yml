# roles/proxmox_template_build/tasks/build_template.yml
---
- name: 空のVM(テンプレートの器)を作成する
  ansible.builtin.command:
    cmd: >-
      qm create {{ os_defaults.template_vmid }}
      --name {{ os_defaults.template_name }}
      --memory 2048
      --cores 2
      --net0 virtio,bridge=vmbr0
      --scsihw virtio-scsi-pci
      --ostype l26
  delegate_to: "{{ proxmox_node }}"
  changed_when: true

- name: Cloud imageをVMのディスクとしてインポートする
  ansible.builtin.command:
    cmd: >-
      qm importdisk {{ os_defaults.template_vmid }}
      {{ proxmox_image_cache_dir }}/{{ os_defaults.cloud_image_filename }}
      {{ proxmox_storage }}
  delegate_to: "{{ proxmox_node }}"
  register: proxmox_template_build_importdisk
  changed_when: >-
    'transferred' in proxmox_template_build_importdisk.stdout or
    'successfully imported' in proxmox_template_build_importdisk.stdout

- name: インポートしたディスクをscsi0としてVMにアタッチする
  ansible.builtin.command:
    cmd: >-
      qm set {{ os_defaults.template_vmid }}
      --scsi0 {{ proxmox_storage }}:vm-{{ os_defaults.template_vmid }}-disk-0
  delegate_to: "{{ proxmox_node }}"
  changed_when: false

- name: Cloud-init用ドライブを追加する
  ansible.builtin.command:
    cmd: >-
      qm set {{ os_defaults.template_vmid }}
      --ide2 {{ proxmox_storage }}:cloudinit
  delegate_to: "{{ proxmox_node }}"
  changed_when: false

# 以下のCloud-init設定はすべて任意。ansible-playbook実行時に -e で
# ssh_user / ssh_pubkey / ipv4 / ipv4_gw / ipv6 / ipv6_gw を
# 指定した場合のみ適用される(未指定ならスキップされ、クローン後に
# 個別設定する運用のまま変わらない)。ipv4/ipv6はプレフィックス長込みの
# CIDR形式(例: 192.168.10.50/24, 2001:db8::50/64)で指定する。
- name: Cloud-initのデフォルトユーザーを設定する
  ansible.builtin.command:
    cmd: "qm set {{ os_defaults.template_vmid }} --ciuser {{ ssh_user }}"
  delegate_to: "{{ proxmox_node }}"
  changed_when: false
  when: (ssh_user | default('', true)) | length > 0

- name: Cloud-init用のSSH公開鍵を対象ノード上に一時ファイルとして書き出す
  ansible.builtin.copy:
    content: "{{ ssh_pubkey }}\n"
    dest: "/tmp/proxmox_template_build_{{ os_defaults.template_vmid }}_sshkey.pub"
    mode: "0600"
  delegate_to: "{{ proxmox_node }}"
  when: (ssh_pubkey | default('', true)) | length > 0

- name: Cloud-initのSSH公開鍵を設定する
  ansible.builtin.command:
    cmd: >-
      qm set {{ os_defaults.template_vmid }}
      --sshkey /tmp/proxmox_template_build_{{ os_defaults.template_vmid }}_sshkey.pub
  delegate_to: "{{ proxmox_node }}"
  changed_when: false
  when: (ssh_pubkey | default('', true)) | length > 0

- name: SSH公開鍵の一時ファイルを削除する
  ansible.builtin.file:
    path: "/tmp/proxmox_template_build_{{ os_defaults.template_vmid }}_sshkey.pub"
    state: absent
  delegate_to: "{{ proxmox_node }}"
  when: (ssh_pubkey | default('', true)) | length > 0

- name: Cloud-initのIPアドレス設定文字列を組み立てる
  ansible.builtin.set_fact:
    proxmox_template_build_ipconfig0: >-
      {{
        [
          ('ip=' + ipv4) if (ipv4 | default('', true) | length > 0) else '',
          ('gw=' + ipv4_gw) if (ipv4_gw | default('', true) | length > 0) else '',
          ('ip6=' + ipv6) if (ipv6 | default('', true) | length > 0) else '',
          ('gw6=' + ipv6_gw) if (ipv6_gw | default('', true) | length > 0) else ''
        ] | reject('equalto', '') | join(',')
      }}
  when: >-
    (ipv4 | default('', true) | length > 0) or
    (ipv6 | default('', true) | length > 0)

- name: Cloud-initのIPアドレスを設定する
  ansible.builtin.command:
    cmd: "qm set {{ os_defaults.template_vmid }} --ipconfig0 {{ proxmox_template_build_ipconfig0 }}"
  delegate_to: "{{ proxmox_node }}"
  changed_when: false
  when: >-
    (ipv4 | default('', true) | length > 0) or
    (ipv6 | default('', true) | length > 0)

- name: ブートディスクの順序を設定する
  ansible.builtin.command:
    cmd: "qm set {{ os_defaults.template_vmid }} --boot c --bootdisk scsi0"
  delegate_to: "{{ proxmox_node }}"
  changed_when: false

- name: シリアルコンソールを追加する(ヘッドレスVM向け)
  ansible.builtin.command:
    cmd: "qm set {{ os_defaults.template_vmid }} --serial0 socket --vga serial0"
  delegate_to: "{{ proxmox_node }}"
  changed_when: false

- name: VMをテンプレート化する
  ansible.builtin.command:
    cmd: "qm template {{ os_defaults.template_vmid }}"
  delegate_to: "{{ proxmox_node }}"
  register: proxmox_template_build_vm_template
  changed_when: >-
    proxmox_template_build_vm_template.rc == 0 and
    'already a template' not in proxmox_template_build_vm_template.stdout
