# roles/proxmox_template_build/tasks/remove_existing_on_other_node.yml
#
# 指定ノード(proxmox_node)とは異なるノードに既にテンプレートVMが存在する場合、
# それを削除する。削除後は build_template.yml が指定ノードで新規構築を行う。
---
- name: "既存テンプレートVMを削除する ({{ proxmox_template_build_existing_node | default('unknown') }})"
  ansible.builtin.command:
    cmd: "qm destroy {{ os_defaults.template_vmid }} --purge"
  delegate_to: "{{ proxmox_template_build_existing_node | default(proxmox_node) }}"
  register: proxmox_template_build_destroy_result
  changed_when: proxmox_template_build_destroy_result.rc == 0

- name: 削除が完了したことを確認する
  ansible.builtin.command:
    cmd: "qm status {{ os_defaults.template_vmid }}"
  delegate_to: "{{ proxmox_template_build_existing_node | default(proxmox_node) }}"
  register: proxmox_template_build_destroy_verify
  changed_when: false
  failed_when: false

- name: 削除に失敗していないか検証する
  ansible.builtin.assert:
    that:
      - proxmox_template_build_destroy_verify.rc != 0
    fail_msg: >-
      {{ proxmox_template_build_existing_node }} 上のVMID
      {{ os_defaults.template_vmid }} の削除に失敗した可能性があります。
      手動で状態を確認してください。
    quiet: true
