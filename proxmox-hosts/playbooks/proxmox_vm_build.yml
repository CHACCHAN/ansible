# このplaybookは利用可能なテンプレートが存在していること前提で動作します
# proxmox_template_buildの実行後の実行を推奨です
---
- name: 接続先のProxmoxホストを登録する
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../vault/secrets.yml"

  tasks:
    - name: proxmoxというグループでホストを追加
      ansible.builtin.import_tasks: ../tasks/register-proxmox-host.yml

- name: Proxmox VMを構築する
  hosts: proxmox
  gather_facts: false

  roles:
    - proxmox_vm_build
