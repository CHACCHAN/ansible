# このplaybookは既存VMを削除します(元に戻せません)。
---
- name: 接続先のProxmoxホストを登録する
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../vault/secrets.yml"

  tasks:
    - name: proxmoxというグループでホストを追加
      ansible.builtin.import_tasks: ../tasks/register-proxmox-host.yml

- name: Proxmox VMを削除する
  hosts: proxmox
  gather_facts: false

  roles:
    - proxmox_vm_delete
