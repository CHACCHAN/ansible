# このplaybookは既存VMのハードウェア設定(CPU/メモリの変更、ディスクや
# NICなどの追加・削除)を行います。対象VMの電源がオフの場合のみ変更を許可します。
---
- name: 接続先のProxmoxホストを登録する
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../vault/secrets.yml"

  tasks:
    - name: Proxmoxというグループでホストを追加
      ansible.builtin.import_tasks: ../tasks/register-proxmox-host.yml

- name: Proxmox VMのハードウェア設定を変更する
  hosts: proxmox
  gather_facts: false

  roles:
    - proxmox_vm_hardware
