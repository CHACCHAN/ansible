# 接続先ホスト自身にノード名を問い合わせる。
# クラスタ未構成のスタンドアロン環境でも /cluster/status は自ノードを返す。
---
- name: クラスタ状態を取得する
  ansible.builtin.command:
    cmd: pvesh get /cluster/status --output-format json
  changed_when: false
  register: proxmox_template_build_cluster_status

- name: 接続先ノード名を特定する
  ansible.builtin.set_fact:
    proxmox_template_build_node: >-
      {{
        (proxmox_template_build_cluster_status.stdout | from_json)
        | selectattr('type', 'equalto', 'node')
        | selectattr('local', 'defined')
        | selectattr('local', 'equalto', 1)
        | map(attribute='name')
        | first
      }}

- name: 接続先ノード名を表示する
  ansible.builtin.debug:
    msg: "接続先ノード: {{ proxmox_template_build_node }} ({{ inventory_hostname }})"
