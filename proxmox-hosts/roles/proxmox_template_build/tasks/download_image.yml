---
- name: イメージキャッシュディレクトリが存在することを確認する
  ansible.builtin.file:
    path: "{{ proxmox_image_cache_dir }}"
    state: directory
    mode: "0755"

- name: チェックサムファイルを取得する
  ansible.builtin.uri:
    url: "{{ os_defaults.cloud_image_checksum_url }}"
    return_content: true
    timeout: 30
  register: proxmox_template_build_checksum_file
  retries: 3
  delay: 5
  until: proxmox_template_build_checksum_file is succeeded

# チェックサムファイルの形式はOSによって異なる:
- name: ハッシュ値の文字数を算出する
  ansible.builtin.set_fact:
    proxmox_template_build_checksum_hex_len: >-
      {{ {'sha256': 64, 'sha512': 128}[os_defaults.cloud_image_checksum_algorithm] }}

- name: チェックサムファイルの内容を整形する
  ansible.builtin.set_fact:
    proxmox_template_build_checksum_raw: "{{ proxmox_template_build_checksum_file.content | trim }}"

- name: 対象イメージのチェックサムを抽出する
  ansible.builtin.set_fact:
    proxmox_template_build_expected_checksum: >-
      {{
        proxmox_template_build_checksum_raw
        if (proxmox_template_build_checksum_raw | length == proxmox_template_build_checksum_hex_len | int)
        else ((proxmox_template_build_checksum_raw
          | regex_search('[a-f0-9]{' + (proxmox_template_build_checksum_hex_len | string) + '}\s+\*?' + os_defaults.cloud_image_filename))
          | default('', true))[:proxmox_template_build_checksum_hex_len | int]
      }}

- name: チェックサムが取得できなかった場合は早期に失敗させる
  ansible.builtin.assert:
    that:
      - proxmox_template_build_expected_checksum is not none
      - proxmox_template_build_expected_checksum | length == proxmox_template_build_checksum_hex_len | int
    fail_msg: >-
      {{ os_defaults.cloud_image_checksum_url }} 内に
      {{ os_defaults.cloud_image_filename }} のチェックサムが見つかりませんでした。
      チェックサムファイルのフォーマットが変わっている可能性があります。
    quiet: true

- name: Cloud imageをダウンロードする(既存ファイルとチェックサムが一致する場合はスキップ)
  ansible.builtin.get_url:
    url: "{{ os_defaults.cloud_image_url }}"
    dest: "{{ proxmox_image_cache_dir }}/{{ os_defaults.cloud_image_filename }}"
    checksum: "{{ os_defaults.cloud_image_checksum_algorithm }}:{{ proxmox_template_build_expected_checksum }}"
    mode: "0644"
    timeout: 300
  register: proxmox_template_build_image_download
