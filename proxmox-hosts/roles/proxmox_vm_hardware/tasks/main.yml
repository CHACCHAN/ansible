# 全タスクは接続先のProxmoxホスト(-e proxmox_ip で指定)上で直接実行される。
# 対象VMの電源がオフの場合のみハードウェア変更を許可する。
#
# vm_hardwareは以下のカテゴリに分けて指定する(qmコマンドのオプションに準拠):
#   cpu     : cores, sockets, type(→cputype), numa, vcpus, その他 --cpu プロパティ文字列のキー
#   memory  : size(→--memory), balloon(→--balloon)
#   disks   : [{bus, index, storage+size または volume, その他ディスクオプション}, ...]
#   network : [{index, model, bridge, その他ネットワークオプション}, ...]
#   options : 上記に当てはまらない qm set オプションをそのまま {"オプション名":値} で指定
# vm_hardware_deleteは削除したいqmプロパティ名のリスト(カテゴリ分けなし)
#
# 各処理を役割ごとにファイル分割している:
#   validate.yml                            : 必須変数の検証・正規化
#   ../../../tasks/detect_proxmox_node.yml  : 接続先のノード名を自動取得(共通タスク)
#   check_vm_state.yml                      : VMの存在・配置ノード・電源状態を確認
#   change_hardware.yml                     : 各カテゴリをqm setの引数に変換して実行
---
- name: 必須変数を検証する
  ansible.builtin.import_tasks: validate.yml

- name: 接続先のノード名を取得する
  ansible.builtin.import_tasks: ../../../tasks/detect_proxmox_node.yml

- name: VMの状態を確認する
  ansible.builtin.import_tasks: check_vm_state.yml

- name: ハードウェア設定を変更する
  ansible.builtin.import_tasks: change_hardware.yml
