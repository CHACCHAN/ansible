# イメージは展開後あわせて約1.5GiB(server 約1GiB + postgres 約0.3GiB)。
# 途中で容量が尽きると "no space left on device" という分かりにくい失敗になるため、
# 取得を始める前に確認する。
---
- name: Dockerのデータを置くファイルシステムを特定する
  ansible.builtin.set_fact:
    # 候補を文字列としてソートすると、最も深いマウントが末尾に来る
    authentik_disk_mount: >-
      {{ (ansible_mounts
          | selectattr('mount', 'in', ['/', '/var', '/var/lib',
                                       '/var/lib/docker', '/var/lib/containerd'])
          | sort(attribute='mount') | last) | default({}, true) }}

- name: 空き容量とディスクの状態を求める
  ansible.builtin.set_fact:
    authentik_disk_free_gb: >-
      {{ ((authentik_disk_mount.size_available | default(0)) / (1024**3)) | round(1) }}
    authentik_disk_total_gb: >-
      {{ ((authentik_disk_mount.size_total | default(0)) / (1024**3)) | round(1) }}
    # /dev/sda1 → sda、/dev/nvme0n1p1 → nvme0n1
    authentik_disk_device: >-
      {{ (authentik_disk_mount.device | default(''))
         | regex_replace('^/dev/', '')
         | regex_replace('p?[0-9]+$', '') }}

- name: ブロックデバイスの実サイズを求める
  ansible.builtin.set_fact:
    authentik_disk_device_gb: >-
      {{ ((ansible_devices[authentik_disk_device].sectors | int)
          * (ansible_devices[authentik_disk_device].sectorsize | int)
          / (1024**3)) | round(1) }}
  when: authentik_disk_device in (ansible_devices | default({}))

# 「ディスク自体が小さい」のか「ホスト側で拡張済みだがゲストが未拡張」なのかで
# 対処が変わるため、案内文を切り替える。
- name: 容量不足だった場合の案内文を用意する
  ansible.builtin.set_fact:
    authentik_disk_hint: >-
      {{
        'ブロックデバイスは ' ~ authentik_disk_device_gb ~ 'GiB あるのに、'
        ~ 'ファイルシステムは ' ~ authentik_disk_total_gb ~ 'GiB しかありません。'
        ~ 'VMを再起動すればcloud-initのgrowpartが自動で拡張します'
        ~ '(手動なら growpart /dev/' ~ authentik_disk_device ~ ' 1 と resize2fs)。'
        if (authentik_disk_device_gb is defined
            and (authentik_disk_device_gb | float) > ((authentik_disk_total_gb | float) + 2))
        else
        'ディスク自体が小さい状態です(テンプレート素のままだと数GBしかありません)。'
        ~ 'proxmox-hosts/playbooks/proxmox_vm_hardware.yml のresizeで拡張してください'
        ~ '(VMの停止が必要)。proxmox/ から構築した場合は vm_hardware のresizeの'
        ~ '指定漏れを確認してください。'
      }}

- name: 空き容量が足りているか確認する
  ansible.builtin.assert:
    that:
      - (authentik_disk_free_gb | float) >= (authentik_min_free_disk_gb | default(5) | float)
    fail_msg: >-
      {{ authentik_disk_mount.mount | default('/') }} の空き容量が足りません
      (空き {{ authentik_disk_free_gb }}GiB / 全体 {{ authentik_disk_total_gb }}GiB、
      必要 {{ authentik_min_free_disk_gb | default(5) }}GiB)。
      {{ authentik_disk_hint }}
      -e "authentik_min_free_disk_gb=<GiB>" で必要量を変更できます。
    quiet: true

- name: 空き容量を表示する
  ansible.builtin.debug:
    msg: >-
      {{ authentik_disk_mount.mount | default('/') }} の空き容量:
      {{ authentik_disk_free_gb }}GiB / {{ authentik_disk_total_gb }}GiB
