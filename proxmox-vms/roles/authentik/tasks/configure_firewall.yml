# Debianのcloud imageは既定でufw未導入のため通常はスキップされる。
# 利用者が後からufwを有効にしていた場合のみポートを開ける(導入も有効化もしない)。
---
- name: Ufwが導入されているか確認する
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: authentik_ufw_bin

- name: Ufwが有効になっているか確認する
  ansible.builtin.command:
    cmd: ufw status
  become: true
  changed_when: false
  failed_when: false
  register: authentik_ufw_status
  when: authentik_ufw_bin.stat.exists

- name: "WebUIのポートをufwで開放する({{ item }})"
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  become: true
  loop:
    - "{{ authentik_http_port }}"
    - "{{ authentik_https_port }}"
  when:
    - authentik_ufw_bin.stat.exists
    - "'Status: active' in (authentik_ufw_status.stdout | default(''))"
