# Docker ComposeでAuthentik(server / worker / PostgreSQL)を構築する。Debian専用。
# 全VM共通の処理は proxmox-vms/tasks/ 配下(= ../../../tasks/)と共有している。
---
- name: 対象OSを確認する
  ansible.builtin.import_tasks: ../../../tasks/assert_debian.yml

- name: 必須変数を検証する
  ansible.builtin.import_tasks: validate.yml

# パッケージ更新やイメージ取得の途中で容量が尽きると原因が分かりにくいため先に確認する
- name: ディスクの空き容量を確認する
  ansible.builtin.import_tasks: ../../../tasks/check_disk_space.yml
  vars:
    svc_name: Authentik
    svc_min_free_gb: "{{ authentik_min_free_disk_gb }}"
    svc_min_free_var: authentik_min_free_disk_gb

- name: VM共通の初期セットアップを実行する
  ansible.builtin.import_tasks: ../../../tasks/setup_standard_vm.yml

- name: Dockerをインストールする
  ansible.builtin.import_tasks: ../../../tasks/install_docker.yml

- name: Authentik用のディレクトリを準備する
  ansible.builtin.import_tasks: prepare_directories.yml

- name: Authentikの環境設定(.env)を配置する
  ansible.builtin.import_tasks: configure_env.yml

- name: Authentikのコンテナを起動する
  ansible.builtin.import_tasks: ../../../tasks/deploy_compose.yml
  vars:
    svc_name: Authentik
    svc_install_dir: "{{ authentik_install_dir }}"
    svc_config_changed: "{{ authentik_env_file is changed }}"

- name: WebUIのポートを開放する
  ansible.builtin.import_tasks: ../../../tasks/configure_ufw_ports.yml
  vars:
    svc_ufw_ports:
      - { port: "{{ authentik_http_port }}", proto: tcp }
      - { port: "{{ authentik_https_port }}", proto: tcp }

- name: WebUIが応答することを確認する
  ansible.builtin.import_tasks: verify_service.yml
