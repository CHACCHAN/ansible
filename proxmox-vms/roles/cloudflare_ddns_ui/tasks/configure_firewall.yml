# Debianのcloud imageは既定でufw未導入のため通常はスキップされる。
# 利用者が後からufwを有効にしていた場合のみポートを開ける(導入も有効化もしない)。
#
# なお、Dockerが公開したポートはufwのINPUTを通らないため、ここで開けなくても
# 外から繋がる。ufw運用のVMで設定が食い違って見えないように揃えているだけ。
# 待ち受けを127.0.0.1に絞っている場合はVMの外に出ないため何もしない。
---
- name: Ufwが導入されているか確認する
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: cloudflare_ddns_ui_ufw_bin

- name: Ufwが有効になっているか確認する
  ansible.builtin.command:
    cmd: ufw status
  become: true
  changed_when: false
  failed_when: false
  register: cloudflare_ddns_ui_ufw_status
  when: cloudflare_ddns_ui_ufw_bin.stat.exists

- name: "Web UI(tcp)のポートをufwで開放する: {{ cloudflare_ddns_ui_http_port }}"
  community.general.ufw:
    rule: allow
    port: "{{ cloudflare_ddns_ui_http_port }}"
    proto: tcp
  become: true
  when:
    - cloudflare_ddns_ui_published | bool
    - cloudflare_ddns_ui_ufw_bin.stat.exists
    - "'Status: active' in (cloudflare_ddns_ui_ufw_status.stdout | default(''))"
