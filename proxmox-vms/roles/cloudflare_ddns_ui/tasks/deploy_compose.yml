---
- name: Compose定義(docker-compose.yml)を配置する
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ cloudflare_ddns_ui_install_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  become: true
  register: cloudflare_ddns_ui_compose_file

# config.json は起動時に読み込まれるため、内容が変わったら作り直す
# (docker composeはマウント先の中身の変更を再作成の理由として扱わない)
- name: Cloudflare-ddns-uiのコンテナを起動する
  community.docker.docker_compose_v2:
    project_src: "{{ cloudflare_ddns_ui_install_dir }}"
    state: present
    pull: missing
    remove_orphans: true
    recreate: >-
      {{ 'always'
         if (cloudflare_ddns_ui_compose_file is changed
             or cloudflare_ddns_ui_config_file is changed)
         else 'auto' }}
  become: true
  register: cloudflare_ddns_ui_compose_up

- name: 起動したコンテナを表示する
  ansible.builtin.debug:
    msg: >-
      {{ cloudflare_ddns_ui_compose_up.containers
         | default([]) | map(attribute='Service', default='?') | list | join(', ') }}
      のコンテナを起動しました({{ cloudflare_ddns_ui_install_dir }})。
