# cockpit-dockermanagerは公式Debianリポジトリではなく、GPG署名なしの
# 第三者リポジトリから導入する。docker本体のインストール
# (install_docker.yml)より後に実行し、dockerグループが存在する状態で
# 追加すること。
#
# 署名鍵が提供されていないため trusted: true(署名検証なし)で追加している。
# 信頼できるソースかどうかは利用者側で判断すること。
---
- name: Dockerプラグイン(cockpit-dockermanager)のリポジトリを追加する(GPG未署名)
  ansible.builtin.deb822_repository:
    name: cockpit-dockermanager
    types: deb
    uris: https://chrisjbawden.github.io/cockpit-dockermanager
    suites: stable
    components: main
    architectures: all
    trusted: true
    state: present
  become: true

- name: Cockpit Docker Managerパッケージ(dockermanager)をインストールする
  ansible.builtin.apt:
    name: dockermanager
    update_cache: true
    state: present
  become: true

- name: "Cockpit用ユーザーをdockerグループに追加する({{ development_cockpit_user }})"
  ansible.builtin.user:
    name: "{{ development_cockpit_user }}"
    groups: docker
    append: true
  become: true
