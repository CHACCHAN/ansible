# RDP(xrdp)接続で使うデスクトップ環境一式。
# 接続先はVM自身のIPの固定ポート3389で、WindowsのリモートデスクトップやRDP
# クライアントからそのまま繋げる。
---
- name: デスクトップ環境・xrdp関連パッケージをインストールする
  ansible.builtin.apt:
    name:
      # --- デスクトップ環境(X11セッション。Waylandは対象外) ---
      - xfce4
      - xfce4-goodies
      # XFCEのセッション起動にdbus-launchが必要
      - dbus-x11
      # ロケールをja_JP.UTF-8にしているため、日本語グリフを持つフォントが
      # 無いとデスクトップ上の日本語が文字化け(豆腐)する
      - fonts-noto-cjk
      # --- RDPサーバー ---
      # 認証は標準でPAM対応のため、Linuxの通常ログインパスワードがそのまま使える
      - xrdp
    state: present
  become: true
