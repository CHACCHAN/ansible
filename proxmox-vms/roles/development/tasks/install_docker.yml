# Docker公式の便利インストールスクリプト(get.docker.com)を使う
---
- name: Docker公式インストールスクリプトを取得する
  ansible.builtin.get_url:
    url: https://get.docker.com
    dest: /tmp/get-docker.sh
    mode: "0755"
  become: true

- name: Dockerをインストールする
  ansible.builtin.command:
    cmd: sh /tmp/get-docker.sh
  args:
    creates: /usr/bin/docker
  become: true

- name: "管理者権限なしでdockerコマンドを使えるようグループに追加する({{ vm_ssh_user }})"
  ansible.builtin.user:
    name: "{{ vm_ssh_user }}"
    groups: docker
    append: true
  become: true
