# 公式ドキュメント(https://kubernetes.io/docs/tasks/tools/install-kubectl-linux/)の
# 手順に従い、最新安定版のkubectlバイナリをチェックサム検証付きで導入する
---
- name: 最新安定版のkubectlバージョン番号を取得する
  ansible.builtin.uri:
    url: https://dl.k8s.io/release/stable.txt
    return_content: true
  register: development_kubectl_version
  changed_when: false

- name: チェックサム検証付きでkubectlバイナリをダウンロードする
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ development_kubectl_version.content | trim }}/bin/linux/amd64/kubectl"
    checksum: "sha256:https://dl.k8s.io/release/{{ development_kubectl_version.content | trim }}/bin/linux/amd64/kubectl.sha256"
    dest: /usr/local/bin/kubectl
    owner: root
    group: root
    mode: "0755"
  become: true
