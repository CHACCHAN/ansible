# k3sでKubernetesのノードを構築する。Debian 13(cloud image)専用。
# 全VM共通の処理は proxmox-vms/tasks/ 配下(= ../../../tasks/)と共有している。
#
# kubernetes_node_role=server でコントロールプレーン、agent でワーカーになる。
# Dockerは入れない(コンテナランタイムはk3sに同梱のcontainerd)。
---
- name: 対象OSを確認する
  ansible.builtin.import_tasks: ../../../tasks/assert_debian.yml

- name: 必須変数を検証する
  ansible.builtin.import_tasks: validate.yml

- name: OS/パッケージを更新する
  ansible.builtin.import_tasks: ../../../tasks/update_packages.yml

- name: タイムゾーンを設定する
  ansible.builtin.import_tasks: ../../../tasks/configure_timezone.yml

- name: ロケールを設定する
  ansible.builtin.import_tasks: ../../../tasks/configure_locale.yml

# Kubernetesはswapが無い前提のため、既定では共通タスクのzramではなく無効化を行う
- name: スワップを無効化する
  ansible.builtin.import_tasks: disable_swap.yml
  when: kubernetes_disable_swap | bool

- name: スワップ(zram)を設定する
  ansible.builtin.import_tasks: ../../../tasks/configure_swap.yml
  when: not (kubernetes_disable_swap | bool)

- name: SSHユーザーを管理者グループに追加する
  ansible.builtin.import_tasks: ../../../tasks/configure_admin_group.yml

- name: 基本パッケージをインストールする
  ansible.builtin.import_tasks: ../../../tasks/install_base_packages.yml

- name: QEMUゲストエージェントを導入する
  ansible.builtin.import_tasks: ../../../tasks/install_qemu_guest_agent.yml

- name: K3sノードに必要なパッケージをインストールする
  ansible.builtin.import_tasks: install_prerequisites.yml

# 設定ファイルにトークンを書き込むため、k3sを入れる前に取得しておく
- name: 参加用トークンをコントロールプレーンから取得する
  ansible.builtin.import_tasks: fetch_token.yml
  when:
    - kubernetes_join_existing | bool
    - (kubernetes_token | default('', true)) | length == 0

- name: K3sの導入状況を確認する
  ansible.builtin.import_tasks: check_installed.yml

- name: K3sの設定を配置する
  ansible.builtin.import_tasks: configure_k3s.yml

- name: K3sをインストールする
  ansible.builtin.import_tasks: install_k3s.yml

- name: ノードがクラスタに参加できたことを確認する
  ansible.builtin.import_tasks: verify_cluster.yml

- name: SSHユーザーのkubeconfigを配置する
  ansible.builtin.import_tasks: configure_kubeconfig.yml
  when: kubernetes_role_resolved == 'server'

- name: K3sが使うポートを開放する
  ansible.builtin.import_tasks: configure_firewall.yml
