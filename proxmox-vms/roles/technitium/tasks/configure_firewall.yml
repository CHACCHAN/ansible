# Debianのcloud imageは既定でufw未導入のため通常はスキップされる。
# 利用者が後からufwを有効にしていた場合のみポートを開ける(導入も有効化もしない)。
#
# なお、Dockerが公開したポートはufwのINPUTを通らないため、ここで開けなくても
# 外から繋がる。ufw運用のVMで設定が食い違って見えないように揃えているだけ。
---
- name: Ufwが導入されているか確認する
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: technitium_ufw_bin

- name: Ufwが有効になっているか確認する
  ansible.builtin.command:
    cmd: ufw status
  become: true
  changed_when: false
  failed_when: false
  register: technitium_ufw_status
  when: technitium_ufw_bin.stat.exists

- name: "DNS・Webコンソールのポートをufwで開放する: {{ item.port ~ '/' ~ (item.proto | default('tcp')) }}"
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
  become: true
  loop: >-
    {{ [{'port': technitium_dns_port, 'proto': 'udp'},
        {'port': technitium_dns_port, 'proto': 'tcp'},
        {'port': technitium_http_port, 'proto': 'tcp'}]
       + ([{'port': technitium_https_port, 'proto': 'tcp'}]
          if (technitium_enable_https_console | bool) else [])
       + technitium_extra_ports }}
  when:
    - technitium_ufw_bin.stat.exists
    - "'Status: active' in (technitium_ufw_status.stdout | default(''))"
