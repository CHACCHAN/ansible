# Docker Composeでwg-easy(WireGuardのVPNサーバー + Web UI)を構築する。Debian専用。
# 全VM共通の処理は proxmox-vms/tasks/ 配下(= ../../../tasks/)と共有している。
#
# 設定はすべて環境変数(.env)で渡す。初期セットアップ(INIT_*)は初回起動時のみ有効。
---
- name: 対象OSを確認する
  ansible.builtin.import_tasks: ../../../tasks/assert_debian.yml

- name: 必須変数を検証する
  ansible.builtin.import_tasks: validate.yml

- name: OS/パッケージを更新する
  ansible.builtin.import_tasks: ../../../tasks/update_packages.yml

- name: タイムゾーンを設定する
  ansible.builtin.import_tasks: ../../../tasks/configure_timezone.yml

- name: ロケールを設定する
  ansible.builtin.import_tasks: ../../../tasks/configure_locale.yml

- name: スワップ(zram)を設定する
  ansible.builtin.import_tasks: ../../../tasks/configure_swap.yml

- name: SSHユーザーを管理者グループに追加する
  ansible.builtin.import_tasks: ../../../tasks/configure_admin_group.yml

- name: 基本パッケージをインストールする
  ansible.builtin.import_tasks: ../../../tasks/install_base_packages.yml

- name: QEMUゲストエージェントを導入する
  ansible.builtin.import_tasks: ../../../tasks/install_qemu_guest_agent.yml

- name: Dockerをインストールする
  ansible.builtin.import_tasks: ../../../tasks/install_docker.yml

- name: Wg-easy用のディレクトリを準備する
  ansible.builtin.import_tasks: prepare_directories.yml

- name: 環境変数(.env)を配置する
  ansible.builtin.import_tasks: configure_env.yml

- name: Wg-easyのコンテナを起動する
  ansible.builtin.import_tasks: deploy_compose.yml

- name: WireGuardとWeb UIのポートを開放する
  ansible.builtin.import_tasks: configure_firewall.yml

- name: Web UIとWireGuardの状態を確認する
  ansible.builtin.import_tasks: verify_service.yml
