[defaults]
# このディレクトリのplaybookは proxmox-hosts / proxmox-vms のplaybookを
# import_playbook で呼び出すだけなので、ロールは両方のディレクトリから探す。
# (import_playbookされたplaybook自身のディレクトリは検索対象にならないため)
roles_path = ../proxmox-hosts/roles:../proxmox-vms/roles
# 接続先ノードと、そのノードで構築するVMの既定値を置く。
# 対象ノードは -e "proxmox_ip=<IP>" で選び、-e で渡した変数が常に優先される。
inventory = ./inventory
localhost_warning = False
