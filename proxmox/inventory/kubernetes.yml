# playbooks/kubernetes.yml 用。1ホスト = 構築するVM1台、ホスト名はVMのIPアドレス。
# ここに書いた値は既定値で、-e で同じ変数を渡すとそちらが優先される。
#
#   全台: ansible-playbook playbooks/kubernetes.yml --ask-vault-pass
#   個別: ansible-playbook playbooks/kubernetes.yml --ask-vault-pass --limit 192.168.10.71
#   複数: --limit '192.168.10.71,192.168.10.72'
#
# 全台実行のときは「コントロールプレーン → ワーカー」の順に1台ずつ構築される
# (ワーカーは参加先のコントロールプレーンからトークンを自動取得するため)。
#
# パスワード類は平文で書かないこと(-e で渡すか ansible-vault encrypt_string を使う)。
---
kubernetes:
  hosts:
    # --- コントロールプレーン ---
    192.168.10.70:
      vm_id: 1020
      vm_name: k3s-cp01          # VM名がそのままKubernetesのノード名になる
      vm_node: 192.168.10.11     # 構築先のProxmoxノード
      kubernetes_node_role: server

    # --- ワーカー ---
    192.168.10.71:
      vm_id: 1021
      vm_name: k3s-worker01
      vm_node: 192.168.10.11
      kubernetes_node_role: agent

    192.168.10.72:
      vm_id: 1022
      vm_name: k3s-worker02
      vm_node: 192.168.10.11
      kubernetes_node_role: agent

  vars:
    # --- k3s ---
    # ワーカーの参加先。コントロールプレーン自身にも渡るが、自分を指す値は
    # 「クラスタの1台目」として扱われるためグループ共通で書ける。
    # 指定できる項目は proxmox-vms/docs/kubernetes.md を参照。
    kubernetes_server_ip: 192.168.10.70
    # kubernetes_version: v1.34.1+k3s1   # 未指定なら最新安定版
    # kubernetes_disable: [traefik]      # 標準コンポーネントの無効化
    # kubernetes_cluster_init: true      # HA構成にする予定があるなら1台目で有効化

    # --- ネットワーク ---
    vm_ipv4_prefix: 24         # ホスト名(IP)に付けるプレフィックス長
    vm_ipv4_gw: 192.168.10.1

    # 未指定だとProxmoxがホストのDNS設定を引き継ぐ。
    # ホストのDNSがVMから見えない場合は明示すること。
    # vm_nameserver: 192.168.10.1
    # vm_searchdomain: example.local

    # --- Proxmox側 ---
    proxmox_storage: ssd01

    # --- VMのハードウェア(クローン直後・停止中に適用される) ---
    # ディスクは resize で拡張する(disks だと新しい空ディスクに置き換わる)。
    # resize を省くとテンプレート素の約3GBのままになり、コンテナイメージが入らない。
    # ノードごとに変える場合は hosts: の各VMの下に書けば個別に上書きできる。
    vm_hardware:
      cpu:
        cores: 4
        type: host
      memory:
        size: 8192
      options:
        bios: seabios
        machine: q35
        vga: std
      resize:
        - bus: scsi
          index: 0
          size: 64

    # --- VMの動作設定(稼働中でも変更できる) ---
    vm_options:
      agent: 1    # QEMUゲストエージェント(ゲスト側の導入はkubernetesロールが行う)
      onboot: 1   # ノードが落ちたままにならないよう自動起動

    # --- VMのログイン設定 ---
    vm_ssh_user: k3s
    vm_ssh_pubkey_file: ~/.ssh/id_ed25519_test.pub
    vm_ssh_prikey: ~/.ssh/id_ed25519_test
