# Kubernetes(k3s)のVMを、テンプレート構築からクラスタへの参加まで一気通貫で構築します。
# 処理は自前で持たず、proxmox-hosts / proxmox-vms のplaybookを順番に呼ぶだけです。
#
# 対象の決め方は2通り(以降の処理は共通で、対象は kubernetes_targets に集約されます):
#   インベントリ版(既定)  : ../inventory/kubernetes.yml のホスト。--limit で選択
#   手動指定版(manual=true): -e で指定した1台のみ(インベントリが空なら自動でこちら)
#
# VM個別の設定に vm_ 接頭辞を使うのは、-e が全playbookから見えてしまうためです。
# ssh_user や ipv4 をそのまま渡すとテンプレートにも焼き込まれてしまいます。
#
# NICは2枚構成が既定です。nic0(vm_ipv4)が外部通信用でSSHとkubectlに使い、
# nic1(vm_cluster_ipv4)はクラスタ間の占有ネットワークとしてノード間通信だけを流します。
# vm_cluster_ipv4 を指定すると、cloud-initのipconfig1・k3sのnode-ip / flannel-iface・
# ワーカーの参加先までまとめて占有ネットワーク側に寄ります。
#
# 対象は同じホスト名のままグループへ登録し、接続先(ansible_host)だけを切り替えます:
#   手順1〜6(Proxmox操作)     : ansible_host = 構築先ノード
#   手順7〜8(VM内セットアップ): ansible_host = VM自身
#
# k3sはノード間に順番の依存があるため、手順8だけは「コントロールプレーン → ワーカー」の
# 順に1台ずつ実行されます(ワーカーは参加先からトークンを取得するため)。
---
- name: インベントリから構築対象を選ぶ
  hosts: kubernetes
  gather_facts: false
  connection: local

  vars:
    kubernetes_manual_mode: >-
      {{ manual | default((groups['kubernetes'] | default([]) | length) == 0) | bool }}

  tasks:
    - name: インベントリのホストを構築対象に加える
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: kubernetes_targets
      loop: "{{ ansible_play_hosts }}"
      changed_when: false
      when: not (kubernetes_manual_mode | bool)

- name: 手動指定の構築対象を追加する
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    kubernetes_manual_mode: >-
      {{ manual | default((groups['kubernetes'] | default([]) | length) == 0) | bool }}

  tasks:
    - name: 接続先IPアドレスの指定を確認する
      ansible.builtin.assert:
        that:
          - ((vm_ipv4 | default('', true)) | length > 0) or ((vm_ip | default('', true)) | length > 0)
        fail_msg: >-
          手動指定版では vm_ipv4(cloud-initで設定する固定IP。CIDR形式)または
          vm_ip(既にIPが分かっている場合の接続先IP)のどちらかが必要です。
        quiet: true
      when: kubernetes_manual_mode | bool

    # インベントリ版のホスト名の付け方に合わせ、VMのIPアドレスで登録する
    - name: 指定されたVMを構築対象に加える
      ansible.builtin.add_host:
        name: "{{ vm_ip | default((vm_ipv4 | default('')).split('/')[0], true) }}"
        groups: kubernetes_targets
      changed_when: false
      when: kubernetes_manual_mode | bool

- name: 構築対象を確認する
  hosts: kubernetes_targets
  gather_facts: false
  connection: local

  # 登録するホストにProxmoxへの接続情報を持たせるため、呼び出し先と同じvaultを読む
  vars_files:
    - ../../proxmox-hosts/vault/secrets.yml

  tasks:
    # 「-e があればそれ、無ければインベントリ、どちらも無ければ空」の順で解決する
    - name: インベントリと-eの差分を解決する
      ansible.builtin.set_fact:
        # 構築先ノードは vm_node で受け取る。利用者が -e proxmox_ip=... を使うと
        # 呼び出し先がそのIPを別の対象として登録してしまうため名前を分けている
        kubernetes_proxmox_ip: "{{ vm_node | default('', true) }}"
        kubernetes_proxmox_storage: "{{ proxmox_storage | default('', true) }}"
        # VM内のセットアップがDebian(trixie)専用のため既定を固定する
        kubernetes_os_type: "{{ os_type | default('debian', true) }}"
        kubernetes_os_version: "{{ os_version | default('13', true) }}"
        kubernetes_vm_ssh_user: "{{ vm_ssh_user | default('', true) }}"
        kubernetes_vm_ssh_password: "{{ vm_ssh_password | default('', true) }}"
        kubernetes_vm_ssh_prikey: "{{ vm_ssh_prikey | default('', true) }}"
        kubernetes_vm_pubkey_direct: "{{ vm_ssh_pubkey | default('', true) }}"
        kubernetes_vm_pubkey_file: "{{ vm_ssh_pubkey_file | default('', true) }}"
        kubernetes_vm_ipv4_gw: "{{ vm_ipv4_gw | default('', true) }}"
        kubernetes_vm_ipv6: "{{ vm_ipv6 | default('', true) }}"
        kubernetes_vm_ipv6_gw: "{{ vm_ipv6_gw | default('', true) }}"
        kubernetes_vm_nameserver: "{{ vm_nameserver | default('', true) }}"
        kubernetes_vm_searchdomain: "{{ vm_searchdomain | default('', true) }}"
        # 2枚目のNIC(net1)に付けるクラスタ間の占有ネットワークのアドレス(CIDR)。
        # 未指定ならNICは作られてもIPが付かず、クラスタ通信は net0 側で行われる
        kubernetes_vm_cluster_ipv4: "{{ vm_cluster_ipv4 | default('', true) }}"
        # 占有ネットワークは外に出ないため通常は指定しない
        # (デフォルトゲートウェイが2つになると通信経路が不安定になる)
        kubernetes_vm_cluster_ipv4_gw: "{{ vm_cluster_ipv4_gw | default('', true) }}"

    - name: 派生する変数を決定する
      ansible.builtin.set_fact:
        kubernetes_vm_ip: "{{ vm_ip | default(inventory_hostname, true) }}"
        # ホスト名がIPアドレスなので、プレフィックス長を付けてCIDRにする
        kubernetes_vm_ipv4: >-
          {{ vm_ipv4 | default(inventory_hostname + '/' + (vm_ipv4_prefix | default(24) | string), true) }}
        # 内容(vm_ssh_pubkey)が無ければファイル(vm_ssh_pubkey_file)から読む
        kubernetes_vm_ssh_pubkey: >-
          {{
            kubernetes_vm_pubkey_direct
            if (kubernetes_vm_pubkey_direct | length > 0)
            else (lookup('file', kubernetes_vm_pubkey_file | expanduser)
                  if (kubernetes_vm_pubkey_file | length > 0) else '')
          }}
        kubernetes_target_storage: >-
          {{ target_storage | default(kubernetes_proxmox_storage, true) }}
        # 占有ネットワーク側のアドレス部分。k3sの node-ip に渡してクラスタ通信を寄せる
        kubernetes_vm_cluster_ip: "{{ kubernetes_vm_cluster_ipv4.split('/')[0] }}"

    # ノード種別は「ワーカーかどうか」だけをここで判定する(構築の順番を決めるため)。
    # 値の検証と正規化は呼び出し先(proxmox-vms の kubernetes ロール)が行う。
    - name: ノード種別と参加先を決定する
      ansible.builtin.set_fact:
        kubernetes_is_agent: >-
          {{ (kubernetes_node_role | default('server', true) | lower)
             in ['agent', 'worker', 'node'] }}
        # 自分自身を指している場合(グループ変数で全ノードに同じ値を渡した場合)は
        # 1台目のコントロールプレーンなので参加先を持たない
        kubernetes_join_ip: >-
          {{ kubernetes_server_ip | default('', true)
             if (kubernetes_server_ip | default('', true)) != kubernetes_vm_ip
             else '' }}
        # 参加先へSSH接続するときのユーザー・鍵(未指定なら自分と同じもの)
        kubernetes_join_ssh_user: >-
          {{ kubernetes_server_ssh_user | default(kubernetes_vm_ssh_user, true) }}
        kubernetes_join_ssh_prikey: >-
          {{ kubernetes_server_ssh_prikey | default(kubernetes_vm_ssh_prikey, true) }}

    # NICが2枚ある構成では、ノード間通信(kubelet・flannel・etcd)を占有ネットワーク側に
    # 寄せる。SSH接続先(kubernetes_server_ip)は管理ネットワーク側のまま変えないため、
    # APIサーバーへの接続先だけを kubernetes_server_node_ip として別に渡す。
    #
    # 参加先の占有ネットワーク側IPは、この実行に含まれていればそのホストから取る。
    # 既存クラスタにワーカーだけを足す場合は -e で直接指定する。
    - name: 占有ネットワークを使う場合のクラスタ通信先を決定する
      ansible.builtin.set_fact:
        # 明示指定があればそれを優先する(自分自身の値を参照して既存値を残している)
        kubernetes_node_ip: >-
          {{ kubernetes_node_ip | default(kubernetes_vm_cluster_ip, true) }}
        # 自分が占有ネットワークに繋がっていないなら、参加先もそちら側にはしない
        # (届かないアドレスを指してしまうため)
        kubernetes_server_node_ip: >-
          {{
            kubernetes_server_node_ip
            | default(hostvars[kubernetes_join_ip].kubernetes_vm_cluster_ip
                      if ((kubernetes_vm_cluster_ip | length > 0)
                          and (kubernetes_join_ip in ansible_play_hosts)) else '', true)
          }}
      when: (kubernetes_join_ip | length > 0) or (kubernetes_vm_cluster_ip | length > 0)

    # 同じノードに複数台を同時構築するとVMID重複で衝突するため、
    # テンプレート構築はノードごとに先頭の1台だけが担当する
    - name: テンプレート構築を担当するホストを決める
      ansible.builtin.set_fact:
        kubernetes_template_host: >-
          {{
            ansible_play_hosts | map('extract', hostvars)
            | selectattr('kubernetes_proxmox_ip', 'equalto', kubernetes_proxmox_ip)
            | map(attribute='inventory_hostname') | first
          }}

    - name: 構築内容を表示する
      ansible.builtin.debug:
        msg: >-
          VMID {{ vm_id | default('(未指定)') }} ({{ vm_name | default('(未指定)') }})
          → ノード {{ kubernetes_proxmox_ip | default('(未指定)', true) }}
          / ストレージ {{ kubernetes_target_storage | default('(未指定)', true) }}
          / {{ kubernetes_os_type }} {{ kubernetes_os_version }}
          / IP {{ kubernetes_vm_ipv4 }} gw {{ kubernetes_vm_ipv4_gw | default('(未指定)', true) }}
          / 占有ネットワーク {{ kubernetes_vm_cluster_ipv4 | default('(なし。クラスタ通信もnet0)', true) }}
          / ログイン {{ kubernetes_vm_ssh_user | default('(未指定)', true) }}
          / k3s {{ 'ワーカー(参加先 ' ~ kubernetes_join_ip ~ ')'
                   if (kubernetes_is_agent | bool)
                   else 'コントロールプレーン' }}
          / テンプレート構築担当: {{ 'はい' if (inventory_hostname == kubernetes_template_host) else 'いいえ' }}

    # 大きいテンプレートを使う場合もあるため、停止はせず警告だけ出す
    - name: ディスク拡張の指定漏れに注意を促す
      ansible.builtin.debug:
        msg: >-
          【注意】vm_hardware に resize の指定がありません。
          テンプレート素のディスク(数GB)のままVMが構築されるため、
          コンテナイメージを置く /var/lib/rancher がすぐ一杯になります。
          インベントリ版の既定値と同じにするには
          vm_hardware={"cpu":{"cores":4,"type":"host"},"memory":{"size":4096},"network":[{"index":0,"model":"virtio","bridge":"vmbr2"},{"index":1,"model":"virtio","bridge":"vmbr3"}],"resize":[{"bus":"scsi","index":0,"size":32}]}
          のように指定してください。
      when: (vm_hardware | default({})).resize is not defined

    # 占有ネットワークのIPを指定していても、NICが1枚しか無ければ付ける先が無い。
    # テンプレートは net0 だけを持つため、net1 は vm_hardware で足す必要がある
    - name: 占有ネットワーク用NICの指定漏れで停止する
      ansible.builtin.assert:
        that:
          - 1 in ((vm_hardware | default({})).network | default([]) | map(attribute='index') | map('int'))
        fail_msg: >-
          vm_cluster_ipv4({{ kubernetes_vm_cluster_ipv4 }})を指定していますが、
          vm_hardware に2枚目のNIC(network の index: 1)がありません。
          テンプレートは net0 の1枚しか持たないため、占有ネットワークに繋ぐNICを
          vm_hardware={"network":[{"index":0,"model":"virtio","bridge":"vmbr2"},
          {"index":1,"model":"virtio","bridge":"vmbr3"}]} のように追加してください。
        quiet: true
      when: kubernetes_vm_cluster_ipv4 | length > 0

    # 呼び出し先が処理するproxmoxグループへ、ホスト名のまま登録して接続先だけ向け直す。
    # add_hostは1回しか実行されないため、対象ホストをループして1台ずつ登録する。
    - name: テンプレート構築担当をProxmox操作用に登録する
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: proxmox
        ansible_host: "{{ hostvars[item].kubernetes_proxmox_ip }}"
        ansible_user: "{{ hostvars[item].proxmox_ssh_user | default('root', true) }}"
        ansible_password: "{{ vault_proxmox_ssh_password }}"
      loop: "{{ ansible_play_hosts }}"
      changed_when: false
      when: item == hostvars[item].kubernetes_template_host

# 1. cloud imageの取得とテンプレート構築(既にあれば何もしない)
- name: テンプレートを構築する
  ansible.builtin.import_playbook: ../../proxmox-hosts/playbooks/proxmox_template_build.yml
  vars:
    # proxmox_ip は呼び出し先のlocalhostプレイでも参照されるため、
    # 各ホストでは自分の構築先ノード、localhostでは登録済みホストの先頭を使う
    proxmox_ip: "{{ kubernetes_proxmox_ip | default(groups['proxmox'] | first) }}"
    os_type: "{{ kubernetes_os_type }}"
    os_version: "{{ kubernetes_os_version }}"

- name: 残りの構築対象を登録する
  hosts: kubernetes_targets
  gather_facts: false
  connection: local

  vars_files:
    - ../../proxmox-hosts/vault/secrets.yml

  tasks:
    - name: テンプレート構築担当以外をProxmox操作用に登録する
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: proxmox
        ansible_host: "{{ hostvars[item].kubernetes_proxmox_ip }}"
        ansible_user: "{{ hostvars[item].proxmox_ssh_user | default('root', true) }}"
        ansible_password: "{{ vault_proxmox_ssh_password }}"
      loop: "{{ ansible_play_hosts }}"
      changed_when: false
      when: item != hostvars[item].kubernetes_template_host

# 2. テンプレートからVMをクローンする
- name: VMを構築する
  ansible.builtin.import_playbook: ../../proxmox-hosts/playbooks/proxmox_vm_build.yml
  vars:
    proxmox_ip: "{{ kubernetes_proxmox_ip | default(groups['proxmox'] | first) }}"
    template_vmid: "{{ hostvars[kubernetes_template_host].os_defaults.template_vmid }}"
    target_storage: "{{ kubernetes_target_storage }}"

# 3. ハードウェア調整(クローン直後の停止中に適用される)
- name: ハードウェア設定を変更する
  ansible.builtin.import_playbook: ../../proxmox-hosts/playbooks/proxmox_vm_hardware.yml
  when: (vm_hardware is defined) or (vm_hardware_delete is defined)
  vars:
    proxmox_ip: "{{ kubernetes_proxmox_ip | default(groups['proxmox'] | first) }}"

# 4. VMの動作設定(QEMUエージェント・自動起動など)
- name: VMのオプションを変更する
  ansible.builtin.import_playbook: ../../proxmox-hosts/playbooks/proxmox_vm_options.yml
  when: (vm_options is defined) or (vm_options_delete is defined)
  vars:
    proxmox_ip: "{{ kubernetes_proxmox_ip | default(groups['proxmox'] | first) }}"

# 5. cloud-init設定(VM個別)
- name: Cloud-initを設定する
  ansible.builtin.import_playbook: ../../proxmox-hosts/playbooks/proxmox_vm_cloudinit.yml
  vars:
    proxmox_ip: "{{ kubernetes_proxmox_ip | default(groups['proxmox'] | first) }}"
    ssh_user: "{{ kubernetes_vm_ssh_user }}"
    ssh_password: "{{ kubernetes_vm_ssh_password }}"
    ssh_pubkey: "{{ kubernetes_vm_ssh_pubkey }}"
    ipv4: "{{ kubernetes_vm_ipv4 }}"
    ipv4_gw: "{{ kubernetes_vm_ipv4_gw }}"
    ipv6: "{{ kubernetes_vm_ipv6 }}"
    ipv6_gw: "{{ kubernetes_vm_ipv6_gw }}"
    # 2枚目のNIC(vm_hardware の network index:1)に付ける占有ネットワークのアドレス
    net1_ipv4: "{{ kubernetes_vm_cluster_ipv4 }}"
    net1_ipv4_gw: "{{ kubernetes_vm_cluster_ipv4_gw }}"
    nameserver: "{{ kubernetes_vm_nameserver }}"
    searchdomain: "{{ kubernetes_vm_searchdomain }}"

# 6. VMを起動する(cloud-initはこの初回起動時に適用される)
- name: VMを起動する
  ansible.builtin.import_playbook: ../../proxmox-hosts/playbooks/proxmox_vm_powerctl.yml
  vars:
    proxmox_ip: "{{ kubernetes_proxmox_ip | default(groups['proxmox'] | first) }}"
    power_state: "on"

# 7. ここから先は相手がVM自身になるため、接続先をノードからVMへ向け直す
- name: 接続先をVMへ切り替える
  hosts: kubernetes_targets
  gather_facts: false
  connection: local

  tasks:
    # 登録した順にVM内のセットアップが走る(呼び出し先が serial: 1 で1台ずつ処理する)。
    # ワーカーは参加先からトークンを取得するため、先にコントロールプレーンを登録する。
    - name: コントロールプレーンをVM内セットアップ用に登録する
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: vms
        ansible_host: "{{ hostvars[item].kubernetes_vm_ip }}"
        ansible_user: "{{ hostvars[item].kubernetes_vm_ssh_user }}"
        ansible_password: ""
        ansible_ssh_private_key_file: "{{ hostvars[item].kubernetes_vm_ssh_prikey }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      loop: "{{ ansible_play_hosts }}"
      changed_when: false
      when: not (hostvars[item].kubernetes_is_agent | bool)

    - name: ワーカーをVM内セットアップ用に登録する
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: vms
        ansible_host: "{{ hostvars[item].kubernetes_vm_ip }}"
        ansible_user: "{{ hostvars[item].kubernetes_vm_ssh_user }}"
        ansible_password: ""
        ansible_ssh_private_key_file: "{{ hostvars[item].kubernetes_vm_ssh_prikey }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      loop: "{{ ansible_play_hosts }}"
      changed_when: false
      when: hostvars[item].kubernetes_is_agent | bool

    # トークンの取得とReady確認のため、参加先のコントロールプレーンにもSSH接続する。
    # このrunで作らない既存クラスタに参加する場合があるため、対象外でも登録しておく
    # (このrunで作る場合は上で登録済みなので、接続情報を上書きしない)。
    - name: このrunで構築しない参加先を登録する
      ansible.builtin.add_host:
        name: "{{ hostvars[item].kubernetes_join_ip }}"
        groups: kubernetes_servers
        ansible_user: "{{ hostvars[item].kubernetes_join_ssh_user }}"
        ansible_ssh_private_key_file: "{{ hostvars[item].kubernetes_join_ssh_prikey }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      loop: "{{ ansible_play_hosts }}"
      changed_when: false
      when:
        - (hostvars[item].kubernetes_join_ip | length) > 0
        - hostvars[item].kubernetes_join_ip not in ansible_play_hosts

# 起動直後はsshdが動いていてもcloud-initによる鍵の配置が終わっていないことがあるため、
# ポート疎通ではなく実際の接続で待機する
- name: VMにSSH接続できるようになるまで待つ
  hosts: vms
  gather_facts: false

  tasks:
    - name: SSHでログインできるまで待機する
      ansible.builtin.wait_for_connection:
        delay: 5
        sleep: 10
        timeout: "{{ vm_ssh_wait_timeout | default(600) | int }}"

# 8. VM内部のセットアップ。コントロールプレーン → ワーカーの順に1台ずつ実行される。
#    k3sの設定(kubernetes_node_role等)はインベントリや-eの値がそのまま渡る。
- name: VM内部をセットアップする
  ansible.builtin.import_playbook: ../../proxmox-vms/playbooks/kubernetes.yml
  vars:
    # 呼び出し先のlocalhostプレイでも参照されるため、
    # 各VMでは自分の値、localhostでは登録済みホストの先頭の値を使う
    vm_ip: "{{ kubernetes_vm_ip | default(hostvars[groups['vms'] | first].kubernetes_vm_ip) }}"
    vm_ssh_user: >-
      {{ kubernetes_vm_ssh_user | default(hostvars[groups['vms'] | first].kubernetes_vm_ssh_user) }}
    vm_ssh_prikey: >-
      {{ kubernetes_vm_ssh_prikey | default(hostvars[groups['vms'] | first].kubernetes_vm_ssh_prikey) }}
