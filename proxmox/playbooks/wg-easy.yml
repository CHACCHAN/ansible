# wg-easy(WireGuardのVPNサーバー + Web UI)のVMを、テンプレート構築から
# VM内部のセットアップまで一気通貫で構築します。認証は既定でOIDCを使います。
# 処理は自前で持たず、proxmox-hosts / proxmox-vms のplaybookを順番に呼ぶだけです。
#
# 対象の決め方は2通り(以降の処理は共通で、対象は wgvm_targets に集約されます):
#   インベントリ版(既定)  : ../inventory/wg-easy.yml のホスト。--limit で選択
#   手動指定版(manual=true): -e で指定した1台のみ(インベントリが空なら自動でこちら)
#
# VM個別の設定に vm_ 接頭辞を使うのは、-e が全playbookから見えてしまうためです。
# ssh_user や ipv4 をそのまま渡すとテンプレートにも焼き込まれてしまいます。
#
# このplaybook内で使う変数は wgvm_ 接頭辞にしています。アプリ本体の設定は
# wg_easy_ 接頭辞でそのまま手順8へ渡るため、名前が混ざらないよう分けています。
#
# 対象は同じホスト名のままグループへ登録し、接続先(ansible_host)だけを切り替えます:
#   手順1〜6(Proxmox操作)     : ansible_host = 構築先ノード
#   手順7〜8(VM内セットアップ): ansible_host = VM自身
---
- name: インベントリから構築対象を選ぶ
  # グループ名にはハイフンを使えないため、ここだけ wg_easy(アンダースコア)です
  hosts: wg_easy
  gather_facts: false
  connection: local

  vars:
    wgvm_manual_mode: >-
      {{ manual | default((groups['wg_easy'] | default([]) | length) == 0) | bool }}

  tasks:
    - name: インベントリのホストを構築対象に加える
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: wgvm_targets
      loop: "{{ ansible_play_hosts }}"
      changed_when: false
      when: not (wgvm_manual_mode | bool)

- name: 手動指定の構築対象を追加する
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    wgvm_manual_mode: >-
      {{ manual | default((groups['wg_easy'] | default([]) | length) == 0) | bool }}

  tasks:
    - name: 接続先IPアドレスの指定を確認する
      ansible.builtin.assert:
        that:
          - ((vm_ipv4 | default('', true)) | length > 0) or ((vm_ip | default('', true)) | length > 0)
        fail_msg: >-
          手動指定版では vm_ipv4(cloud-initで設定する固定IP。CIDR形式)または
          vm_ip(既にIPが分かっている場合の接続先IP)のどちらかが必要です。
        quiet: true
      when: wgvm_manual_mode | bool

    # インベントリ版のホスト名の付け方に合わせ、VMのIPアドレスで登録する
    - name: 指定されたVMを構築対象に加える
      ansible.builtin.add_host:
        name: "{{ vm_ip | default((vm_ipv4 | default('')).split('/')[0], true) }}"
        groups: wgvm_targets
      changed_when: false
      when: wgvm_manual_mode | bool

- name: 構築対象を確認する
  hosts: wgvm_targets
  gather_facts: false
  connection: local

  # 登録するホストにProxmoxへの接続情報を持たせるため、呼び出し先と同じvaultを読む。
  # OIDCのクライアント情報も同じタイミングで読み込む(どちらも --ask-vault-pass で復号)
  vars_files:
    - ../../proxmox-hosts/vault/secrets.yml
    - ../vault/wg-easy.yml

  tasks:
    # 「-e があればそれ、無ければインベントリ、どちらも無ければ空」の順で解決する
    - name: インベントリと-eの差分を解決する
      ansible.builtin.set_fact:
        # 構築先ノードは vm_node で受け取る。利用者が -e proxmox_ip=... を使うと
        # 呼び出し先がそのIPを別の対象として登録してしまうため名前を分けている
        wgvm_proxmox_ip: "{{ vm_node | default('', true) }}"
        wgvm_proxmox_storage: "{{ proxmox_storage | default('', true) }}"
        # VM内のセットアップがDebian(trixie)専用のため既定を固定する
        wgvm_os_type: "{{ os_type | default('debian', true) }}"
        wgvm_os_version: "{{ os_version | default('13', true) }}"
        wgvm_vm_ssh_user: "{{ vm_ssh_user | default('', true) }}"
        wgvm_vm_ssh_password: "{{ vm_ssh_password | default('', true) }}"
        wgvm_vm_ssh_prikey: "{{ vm_ssh_prikey | default('', true) }}"
        wgvm_vm_pubkey_direct: "{{ vm_ssh_pubkey | default('', true) }}"
        wgvm_vm_pubkey_file: "{{ vm_ssh_pubkey_file | default('', true) }}"
        wgvm_vm_ipv4_gw: "{{ vm_ipv4_gw | default('', true) }}"
        wgvm_vm_ipv6: "{{ vm_ipv6 | default('', true) }}"
        wgvm_vm_ipv6_gw: "{{ vm_ipv6_gw | default('', true) }}"
        wgvm_vm_nameserver: "{{ vm_nameserver | default('', true) }}"
        wgvm_vm_searchdomain: "{{ vm_searchdomain | default('', true) }}"

    - name: 派生する変数を決定する
      ansible.builtin.set_fact:
        wgvm_vm_ip: "{{ vm_ip | default(inventory_hostname, true) }}"
        # ホスト名がIPアドレスなので、プレフィックス長を付けてCIDRにする
        wgvm_vm_ipv4: >-
          {{ vm_ipv4 | default(inventory_hostname + '/' + (vm_ipv4_prefix | default(24) | string), true) }}
        # 内容(vm_ssh_pubkey)が無ければファイル(vm_ssh_pubkey_file)から読む
        wgvm_vm_ssh_pubkey: >-
          {{
            wgvm_vm_pubkey_direct
            if (wgvm_vm_pubkey_direct | length > 0)
            else (lookup('file', wgvm_vm_pubkey_file | expanduser)
                  if (wgvm_vm_pubkey_file | length > 0) else '')
          }}
        wgvm_target_storage: >-
          {{ target_storage | default(wgvm_proxmox_storage, true) }}

    # 同じノードに複数台を同時構築するとVMID重複で衝突するため、
    # テンプレート構築はノードごとに先頭の1台だけが担当する
    - name: テンプレート構築を担当するホストを決める
      ansible.builtin.set_fact:
        wgvm_template_host: >-
          {{
            ansible_play_hosts | map('extract', hostvars)
            | selectattr('wgvm_proxmox_ip', 'equalto', wgvm_proxmox_ip)
            | map(attribute='inventory_hostname') | first
          }}

    # vaultの値をアプリの変数へ渡す。
    # vars_filesはこのプレイの中だけの変数で、手順8(別プレイ)からは見えないため、
    # ホストのfactにして持ち回る(factは同じホスト名のまま次のプレイへ引き継がれる)。
    # -e で同じ変数を渡した場合はそちらが優先される(extra varsの方が強いため)。
    - name: VaultのOIDCクライアント情報をアプリへ渡す
      ansible.builtin.set_fact:
        wg_easy_oauth_oidc_client_id: "{{ vault_wg_easy_oidc_client_id }}"
        wg_easy_oauth_oidc_client_secret: "{{ vault_wg_easy_oidc_client_secret }}"
      no_log: true
      when:
        - (vault_wg_easy_oidc_client_id | default('', true)) | length > 0
        - (vault_wg_easy_oidc_client_secret | default('', true)) | length > 0

    # 管理者の初期パスワード。vaultに無ければロール側で自動生成される
    - name: Vaultの管理者パスワードをアプリへ渡す
      ansible.builtin.set_fact:
        wg_easy_init_password: "{{ vault_wg_easy_init_password }}"
      no_log: true
      when: (vault_wg_easy_init_password | default('', true)) | length > 0

    - name: 構築内容を表示する
      ansible.builtin.debug:
        msg: >-
          VMID {{ vm_id | default('(未指定)') }} ({{ vm_name | default('(未指定)') }})
          → ノード {{ wgvm_proxmox_ip | default('(未指定)', true) }}
          / ストレージ {{ wgvm_target_storage | default('(未指定)', true) }}
          / {{ wgvm_os_type }} {{ wgvm_os_version }}
          / IP {{ wgvm_vm_ipv4 }} gw {{ wgvm_vm_ipv4_gw | default('(未指定)', true) }}
          / ログイン {{ wgvm_vm_ssh_user | default('(未指定)', true) }}
          / VPN {{ wg_easy_init_host | default('(未指定)', true) }}:{{ wg_easy_wg_port | default(51820) }}/udp
          / Web UI http://{{ wgvm_vm_ip }}:{{ wg_easy_ui_port | default(51821) }}/
          / 認証 {{ wg_easy_oauth_providers | default('oidc', true) | default('パスワードのみ', true) }}
          / テンプレート構築担当: {{ 'はい' if (inventory_hostname == wgvm_template_host) else 'いいえ' }}

    # 指定漏れは手順8の冒頭で弾かれるが、そこまで進むと
    # 「VMだけ出来上がって設定が入っていない」状態になる。VMを作る前に止める。
    # (値そのものは見ず、指定があるかどうかだけを確認する)
    - name: クライアントの接続先の指定漏れで停止する
      ansible.builtin.assert:
        that:
          - (wg_easy_init_host | default('', true)) | length > 0
        fail_msg: >-
          クライアントの接続先(wg_easy_init_host)が指定されていません。
          インベントリに書くか、-e "wg_easy_init_host=vpn.example.com" のように
          **外から見た**FQDNまたはグローバルIPを指定してください
          (VMのLAN内IPではありません)。
          ブラウザのウィザードで設定する場合は -e "wg_easy_init_enabled=false" にしてください。
        quiet: true
      when: wg_easy_init_enabled | default(true) | bool

    - name: OIDCの設定漏れで停止する
      ansible.builtin.assert:
        that:
          - (wg_easy_oauth_oidc_server | default('', true)) | length > 0
          - (wg_easy_oauth_oidc_client_id | default('', true)) | length > 0
          - (wg_easy_oauth_oidc_client_secret | default('', true)) | length > 0
        fail_msg: >-
          OIDCのサーバー・クライアントID・クライアントシークレットが揃っていません。
          クライアント情報は ../vault/wg-easy.yml に入れて --ask-vault-pass で実行するか、
          -e で wg_easy_oauth_oidc_client_id / _client_secret を渡してください
          (サーバーURLはインベントリの wg_easy_oauth_oidc_server です)。
          OIDCを使わない場合は -e "wg_easy_oauth_providers=" にしてください。
        quiet: true
      # 既定はロール側と同じくoidc(インベントリや-eで空にすればパスワード認証のみ)
      when: "'oidc' in (wg_easy_oauth_providers | default('oidc', true))"

    # 大きいテンプレートを使う場合もあるため、停止はせず警告だけ出す
    - name: ディスク拡張の指定漏れに注意を促す
      ansible.builtin.debug:
        msg: >-
          【注意】vm_hardware に resize の指定がありません。
          テンプレート素のディスク(数GB)のままVMが構築されます。
          アプリ自体は軽い(イメージは展開後およそ50MB)のですが、
          Dockerとパッケージ更新の分で足りなくなる可能性があります。
          インベントリ版の既定値と同じにするには
          vm_hardware={"cpu":{"cores":2,"type":"host"},"memory":{"size":1024},"resize":[{"bus":"scsi","index":0,"size":8}]}
          のように指定してください。
      when: (vm_hardware | default({})).resize is not defined

    # 呼び出し先が処理するproxmoxグループへ、ホスト名のまま登録して接続先だけ向け直す。
    # add_hostは1回しか実行されないため、対象ホストをループして1台ずつ登録する。
    - name: テンプレート構築担当をProxmox操作用に登録する
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: proxmox
        ansible_host: "{{ hostvars[item].wgvm_proxmox_ip }}"
        ansible_user: "{{ hostvars[item].proxmox_ssh_user | default('root', true) }}"
        ansible_password: "{{ vault_proxmox_ssh_password }}"
      loop: "{{ ansible_play_hosts }}"
      changed_when: false
      when: item == hostvars[item].wgvm_template_host

# 1. cloud imageの取得とテンプレート構築(既にあれば何もしない)
- name: テンプレートを構築する
  ansible.builtin.import_playbook: ../../proxmox-hosts/playbooks/proxmox_template_build.yml
  vars:
    # proxmox_ip は呼び出し先のlocalhostプレイでも参照されるため、
    # 各ホストでは自分の構築先ノード、localhostでは登録済みホストの先頭を使う
    proxmox_ip: "{{ wgvm_proxmox_ip | default(groups['proxmox'] | first) }}"
    os_type: "{{ wgvm_os_type }}"
    os_version: "{{ wgvm_os_version }}"

- name: 残りの構築対象を登録する
  hosts: wgvm_targets
  gather_facts: false
  connection: local

  vars_files:
    - ../../proxmox-hosts/vault/secrets.yml

  tasks:
    - name: テンプレート構築担当以外をProxmox操作用に登録する
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: proxmox
        ansible_host: "{{ hostvars[item].wgvm_proxmox_ip }}"
        ansible_user: "{{ hostvars[item].proxmox_ssh_user | default('root', true) }}"
        ansible_password: "{{ vault_proxmox_ssh_password }}"
      loop: "{{ ansible_play_hosts }}"
      changed_when: false
      when: item != hostvars[item].wgvm_template_host

# 2. テンプレートからVMをクローンする
- name: VMを構築する
  ansible.builtin.import_playbook: ../../proxmox-hosts/playbooks/proxmox_vm_build.yml
  vars:
    proxmox_ip: "{{ wgvm_proxmox_ip | default(groups['proxmox'] | first) }}"
    template_vmid: "{{ hostvars[wgvm_template_host].os_defaults.template_vmid }}"
    target_storage: "{{ wgvm_target_storage }}"

# 3. ハードウェア調整(クローン直後の停止中に適用される)
- name: ハードウェア設定を変更する
  ansible.builtin.import_playbook: ../../proxmox-hosts/playbooks/proxmox_vm_hardware.yml
  when: (vm_hardware is defined) or (vm_hardware_delete is defined)
  vars:
    proxmox_ip: "{{ wgvm_proxmox_ip | default(groups['proxmox'] | first) }}"

# 4. VMの動作設定(QEMUエージェント・自動起動など)
- name: VMのオプションを変更する
  ansible.builtin.import_playbook: ../../proxmox-hosts/playbooks/proxmox_vm_options.yml
  when: (vm_options is defined) or (vm_options_delete is defined)
  vars:
    proxmox_ip: "{{ wgvm_proxmox_ip | default(groups['proxmox'] | first) }}"

# 5. cloud-init設定(VM個別)
- name: Cloud-initを設定する
  ansible.builtin.import_playbook: ../../proxmox-hosts/playbooks/proxmox_vm_cloudinit.yml
  vars:
    proxmox_ip: "{{ wgvm_proxmox_ip | default(groups['proxmox'] | first) }}"
    ssh_user: "{{ wgvm_vm_ssh_user }}"
    ssh_password: "{{ wgvm_vm_ssh_password }}"
    ssh_pubkey: "{{ wgvm_vm_ssh_pubkey }}"
    ipv4: "{{ wgvm_vm_ipv4 }}"
    ipv4_gw: "{{ wgvm_vm_ipv4_gw }}"
    ipv6: "{{ wgvm_vm_ipv6 }}"
    ipv6_gw: "{{ wgvm_vm_ipv6_gw }}"
    nameserver: "{{ wgvm_vm_nameserver }}"
    searchdomain: "{{ wgvm_vm_searchdomain }}"

# 6. VMを起動する(cloud-initはこの初回起動時に適用される)
- name: VMを起動する
  ansible.builtin.import_playbook: ../../proxmox-hosts/playbooks/proxmox_vm_powerctl.yml
  vars:
    proxmox_ip: "{{ wgvm_proxmox_ip | default(groups['proxmox'] | first) }}"
    power_state: "on"

# 7. ここから先は相手がVM自身になるため、接続先をノードからVMへ向け直す
- name: 接続先をVMへ切り替える
  hosts: wgvm_targets
  gather_facts: false
  connection: local

  tasks:
    - name: VM内セットアップ用に登録し直す
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: vms
        ansible_host: "{{ hostvars[item].wgvm_vm_ip }}"
        ansible_user: "{{ hostvars[item].wgvm_vm_ssh_user }}"
        ansible_password: ""
        ansible_ssh_private_key_file: "{{ hostvars[item].wgvm_vm_ssh_prikey }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      loop: "{{ ansible_play_hosts }}"
      changed_when: false

# 起動直後はsshdが動いていてもcloud-initによる鍵の配置が終わっていないことがあるため、
# ポート疎通ではなく実際の接続で待機する
- name: VMにSSH接続できるようになるまで待つ
  hosts: vms
  gather_facts: false

  tasks:
    - name: SSHでログインできるまで待機する
      ansible.builtin.wait_for_connection:
        delay: 5
        sleep: 10
        timeout: "{{ vm_ssh_wait_timeout | default(600) | int }}"

# 8. VM内部のセットアップ。
#    アプリ本体の設定(wg_easy_records等)はインベントリや-eの値がそのまま渡る。
- name: VM内部をセットアップする
  ansible.builtin.import_playbook: ../../proxmox-vms/playbooks/wg-easy.yml
  vars:
    # 呼び出し先のlocalhostプレイでも参照されるため、
    # 各VMでは自分の値、localhostでは登録済みホストの先頭の値を使う
    vm_ip: "{{ wgvm_vm_ip | default(hostvars[groups['vms'] | first].wgvm_vm_ip) }}"
    vm_ssh_user: >-
      {{ wgvm_vm_ssh_user | default(hostvars[groups['vms'] | first].wgvm_vm_ssh_user) }}
    vm_ssh_prikey: >-
      {{ wgvm_vm_ssh_prikey | default(hostvars[groups['vms'] | first].wgvm_vm_ssh_prikey) }}
